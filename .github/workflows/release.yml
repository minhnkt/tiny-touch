name: Release Firmware & Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: tinyTouch ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            firmware/build/tiny_touch_unified.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
          draft: false
          prerelease: false
